<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Preview real do SaaS Mestre Orc</title><desc id="desc">Captura fiel do dashboard dark medieval do Mestre Orc.</desc><rect width="1600" height="900" fill="#050505"/><defs><radialGradient id="dark" cx=".5" cy=".2" r=".9"><stop stop-color="#190707"/><stop offset=".55" stop-color="#070707"/><stop offset="1" stop-color="#020202"/></radialGradient></defs><g font-family="Arial,Helvetica,sans-serif"><rect width="1600" height="900" fill="url(#dark)"/><rect width="1600" height="88" fill="#000" fill-opacity=".86"/><text x="75" y="54" fill="#fff" font-family="Georgia,serif" font-size="25" font-weight="700">MESTRE <tspan fill="#C5A059">ORC</tspan></text><g fill="#fff" fill-opacity=".75" font-size="13"><text x="610" y="53">INÍCIO</text><text x="680" y="53">AVENTURAS</text><text x="785" y="53">AGENDA</text><text x="865" y="53" fill="#C5A059">DASHBOARD</text><text x="980" y="53">IA ORC</text><text x="1050" y="53">IA PRO</text><text x="1120" y="53">BIBLIOTECA</text><text x="1225" y="53">MARKETPLACE</text><text x="1360" y="53">APP MOBILE</text><text x="1470" y="53">ENTRAR</text></g><text x="800" y="150" text-anchor="middle" fill="#C5A059" font-size="16" letter-spacing="3">FASE 4 • SAAS + FOUNDRY BRIDGE + IA DO MESTRE ORC</text><text x="800" y="215" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="48" font-weight="700" letter-spacing="4">DASHBOARD MESTRE ORC</text><text x="800" y="260" text-anchor="middle" fill="#999" font-size="19">Gestão de campanhas, personagens, reservas, exportação Foundry Ready e IA narrativa.</text><g transform="translate(345 300)"><rect width="210" height="50" fill="none" stroke="#C5A059"/><text x="35" y="31" fill="#C5A059" font-size="14" letter-spacing="2">ENTRAR OU CADASTRAR</text><rect x="230" width="220" height="50" fill="none" stroke="#C5A059"/><text x="260" y="31" fill="#C5A059" font-size="14" letter-spacing="2">GERENCIAR CAMPANHAS</text><rect x="470" width="190" height="50" fill="none" stroke="#C5A059"/><text x="508" y="31" fill="#C5A059" font-size="14" letter-spacing="2">BRIDGE FOUNDRY</text><rect x="680" width="180" height="50" fill="none" stroke="#C5A059"/><text x="720" y="31" fill="#C5A059" font-size="14" letter-spacing="2">IA DO MESTRE</text></g><rect x="105" y="400" width="1390" height="210" rx="10" fill="#0c0c0c" stroke="#C5A059" stroke-opacity=".35"/><text x="800" y="445" text-anchor="middle" fill="#C5A059" font-size="15" letter-spacing="3">FASE 2 ATIVA</text><text x="800" y="488" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="30" letter-spacing="3">RESUMO OPERACIONAL</text><text x="800" y="525" text-anchor="middle" fill="#888" font-size="17">Campanhas, personagens e reservas cadastradas no navegador.</text><g transform="translate(190 548)"><rect width="250" height="80" rx="8" fill="#141414"/><text x="25" y="33" fill="#999" font-size="14">CAMPANHAS</text><text x="25" y="64" fill="#C5A059" font-size="26" font-weight="700">3</text><rect x="280" width="250" height="80" rx="8" fill="#141414"/><text x="305" y="33" fill="#999" font-size="14">PERSONAGENS</text><text x="305" y="64" fill="#C5A059" font-size="26" font-weight="700">12</text><rect x="560" width="250" height="80" rx="8" fill="#141414"/><text x="585" y="33" fill="#999" font-size="14">RESERVAS</text><text x="585" y="64" fill="#C5A059" font-size="26" font-weight="700">8</text><rect x="840" width="250" height="80" rx="8" fill="#141414"/><text x="865" y="33" fill="#999" font-size="14">SESSÕES</text><text x="865" y="64" fill="#C5A059" font-size="26" font-weight="700">5</text></g><rect x="105" y="650" width="1390" height="205" rx="10" fill="#0c0c0c" stroke="#C5A059" stroke-opacity=".25"/><text x="800" y="700" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="28" letter-spacing="3">FASES 3 E 4 ATIVAS</text><g transform="translate(170 740)" fill="#